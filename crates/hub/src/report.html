<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor · 诊断报告</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#dbe5df;background:#12221a}*{box-sizing:border-box}body{max-width:1080px;margin:0 auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #34493c;padding-bottom:24px}h1{font-size:28px;margin:8px 0}h2{font-size:16px;margin:0 0 18px}p{color:#9eb5a5;font-size:13px;line-height:1.8}.label{font-size:10px;letter-spacing:2px;color:#8bccaa}.badge{font-size:12px;background:#2f4b38;border:1px solid #49674f;padding:7px 11px;border-radius:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stat,.panel{border:1px solid #334a3a;border-radius:12px;background:#192b20;padding:23px}.stat span{font-size:11px;color:#8ca996}.stat strong{display:block;font-size:23px;font-weight:500;margin-top:14px}.panel{margin-top:20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}select{background:#253e2c;color:#dae9db;border:1px solid #49644d;border-radius:5px;padding:8px;font:inherit;font-size:12px}svg{width:100%;height:230px}.legend{display:flex;gap:22px;font-size:11px;color:#aac0ae}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}.replay{display:flex;align-items:center;gap:18px;margin-top:20px;font-size:12px;color:#a9c1af}input{flex:1;min-width:0;accent-color:#8bccaa}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:13px;border-bottom:1px solid #304637}th{color:#8cab95;font-weight:500}.table{overflow:auto}.notice{font-size:11px;color:#91aa98;margin-top:22px}footer{margin:30px 0;font-size:10px;color:#6f8978}button{background:#2e4e37;color:#cee1d1;border:1px solid #4e7055;border-radius:5px;padding:8px 12px;cursor:pointer}@media(max-width:650px){body{padding:25px 17px}.stats{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column}header{align-items:flex-start}h1{font-size:23px}.panel{padding:18px}.replay{flex-wrap:wrap}svg{height:185px}}
</style></head>
<body><header><div><span class="label">MONITOR / DIAGNOSTIC RECORD</span><h1>故障现场与资源回放</h1><p id="summary"></p></div><span class="badge" id="state"></span></header><div class="stats"><div class="stat"><span>事件类型</span><strong id="kind"></strong></div><div class="stat"><span>观察点</span><strong id="observers"></strong></div><div class="stat"><span>采样数量</span><strong id="count"></strong></div><div class="stat"><span>事件时间</span><strong id="time"></strong></div></div>
<section class="panel"><div class="toolbar"><h2>资源变化</h2><select id="source" aria-label="回放观察点"></select></div><div class="legend"><span><i style="background:#8bccaa"></i>CPU 使用率</span><span><i style="background:#d9b67b"></i>I/O 等待压力</span></div><svg id="chart" viewBox="0 0 900 210" role="img" aria-label="故障期间 CPU 与 I/O 压力曲线"></svg><div class="replay"><span id="position"></span><input id="cursor" type="range" min="0" aria-label="回放采样位置"><span id="value"></span></div><p class="notice">空缺指标保留为不可用。曲线按观察点分别显示，关联变化不等于已经证明因果。</p></section>
<section class="panel"><div class="toolbar"><h2>采样记录</h2><button id="download">下载脱敏 JSON</button></div><div class="table"><table><thead><tr><th>时间</th><th>CPU</th><th>内存</th><th>下载速率</th><th>I/O 等待</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>此文件独立运行，无需连接服务器。已移除地址、主机名、接入凭证、私有备注及原始内核计数器。</footer>
<script type="application/json" id="payload">__MONITOR_DATA__</script>
<script>
const d=JSON.parse(document.getElementById('payload').textContent);const byId=id=>document.getElementById(id);const text=(id,v)=>byId(id).textContent=v;const fmt=t=>new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:d.timezone||'UTC'}).format(t);const bytes=n=>{if(!Number.isFinite(n))return '不可用';const u=['B','KiB','MiB','GiB','TiB'];let i=0;while(n>=1024&&i<4){n/=1024;i++;}return n.toFixed(i?1:0)+' '+u[i]};const ids=[...new Set(d.samples.map(s=>s.node_id))];text('summary',d.event.summary);text('state',d.event.resolved_at?'已恢复':'持续观察');text('kind',({offline:'连接中断',cpu_pressure:'CPU 压力',memory_pressure:'内存压力',io_pressure:'I/O 压力',network_correlation:'网络关联异常',counter_reset:'计数器变化',traffic:'流量提醒'})[d.event.kind]||d.event.kind);text('observers',ids.length);text('count',d.samples.length);text('time',fmt(d.event.time));for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=id;byId('source').append(o)}let samples=[];const has=(s,k)=>!Array.isArray(s.available)||s.available.includes(k);const cpu=s=>has(s,'cpu')&&Number.isFinite(s.cpu)?s.cpu:null;
function svg(tag,attributes){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attributes))e.setAttribute(k,String(v));return e}
function render(){samples=d.samples.filter(s=>s.node_id===byId('source').value).sort((a,b)=>a.time-b.time);const chart=byId('chart');chart.replaceChildren();const left=45,right=880,top=15,bottom=185;for(const v of [0,25,50,75,100]){const y=bottom-v/100*(bottom-top);chart.append(svg('line',{x1:left,x2:right,y1:y,y2:y,stroke:'#354b3c','stroke-dasharray':'3 5'}));const t=svg('text',{x:36,y:y+4,fill:'#8ba291','font-size':10,'text-anchor':'end'});t.textContent=v+'%';chart.append(t)}const start=samples[0]?.time||0,end=samples.at(-1)?.time||start+1;const gaps=samples.slice(1).map((s,i)=>s.time-samples[i].time).filter(v=>v>0).sort((a,b)=>a-b);const gap=Math.max(5000,(gaps[Math.floor(gaps.length/2)]||5000)*3);for(const [get,color]of [[cpu,'#8bccaa'],[s=>s.pressure?.io,'#d9b67b']]){let path='',previous=null;for(const s of samples){const v=get(s);if(!Number.isFinite(v)){previous=null;continue}const x=left+(s.time-start)/Math.max(1,end-start)*(right-left),y=bottom-Math.min(100,v)/100*(bottom-top);path+=(previous===null||s.time-previous>gap?'M':'L')+x+','+y+' ';previous=s.time}chart.append(svg('path',{d:path,fill:'none',stroke:color,'stroke-width':2}))}byId('cursor').max=Math.max(0,samples.length-1);byId('cursor').value=0;position();byId('rows').replaceChildren();for(const s of samples.slice(-120)){const row=document.createElement('tr');for(const value of [fmt(s.time),cpu(s)!==null?cpu(s).toFixed(1)+'%':'不可用',has(s,'memory')?bytes(s.mem_used):'不可用',has(s,'network')?bytes(s.net_rx)+'/s':'不可用',Number.isFinite(s.pressure?.io)?s.pressure.io.toFixed(1)+'%':'不可用']){const c=document.createElement('td');c.textContent=value;row.append(c)}byId('rows').append(row)}}
function position(){const s=samples[+byId('cursor').value];text('position',s?fmt(s.time):'没有可回放的采样');text('value',s?'CPU '+(cpu(s)!==null?cpu(s).toFixed(1)+'%':'不可用')+' · '+(has(s,'memory')?bytes(s.mem_used):'内存不可用'):'')};byId('source').onchange=render;byId('cursor').oninput=position;byId('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='monitor-diagnostic.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></body></html>
